---
- name: info - query backup jobs / per-VM backup membership
  community.proxmox.proxmox_backup_info:
    vm_name:     "{{ proxmox_backup_info_vm_name | default(omit, true) }}"
    vm_id:       "{{ proxmox_backup_info_vm_id | default(omit, true) }}"
    backup_jobs: "{{ proxmox_backup_info_jobs }}"
  register: proxmox_backup_facts
  delegate_to: localhost
