---
- name: proxmox_backup - run with shared API connection defaults
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password | default(omit) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: proxmox_backup - query backup jobs/membership
      ansible.builtin.import_tasks: info.yml
      when: proxmox_backup_do_info | bool
      tags: [proxmox_backup, info]

    - name: proxmox_backup - create/update/delete scheduled backup jobs
      ansible.builtin.import_tasks: job.yml
      when: proxmox_backup_do_job | bool
      tags: [proxmox_backup, job]

    - name: proxmox_backup - toggle VM membership in an existing job
      ansible.builtin.import_tasks: membership.yml
      when: proxmox_backup_do_membership | bool
      tags: [proxmox_backup, membership]

    - name: proxmox_backup - trigger an on-demand backup
      ansible.builtin.import_tasks: run.yml
      when: proxmox_backup_do_run | bool
      tags: [proxmox_backup, run]
