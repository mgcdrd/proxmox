---
- name: apply - fail if required variable is unset
  ansible.builtin.fail:
    msg: "proxmox_network_apply_node is required."
  when: not proxmox_network_apply_node

- name: apply - check for pending network changes
  community.proxmox.proxmox_node_network_info:
    node: "{{ proxmox_network_apply_node }}"
    check_changes: true
  register: proxmox_network_pending
  delegate_to: localhost

- name: apply - apply staged network changes
  community.proxmox.proxmox_node_network:
    node: "{{ proxmox_network_apply_node }}"
    state: apply
  when: proxmox_network_pending.has_pending_changes
  delegate_to: localhost
