---
# No community.proxmox.proxmox_subnet_info module exists upstream — subnets
# aren't listable through this role; check PVE's UI/API directly if needed.

- name: info - list SDN zones
  community.proxmox.proxmox_zone_info:
  register: proxmox_sdn_zone_facts
  delegate_to: localhost

- name: info - list SDN vnets
  community.proxmox.proxmox_vnet_info:
  register: proxmox_sdn_vnet_facts
  delegate_to: localhost
