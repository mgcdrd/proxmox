---
- name: vnet - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_sdn_vnets must be a non-empty list, and each item needs 'vnet' and 'zone' keys."
  when: proxmox_sdn_vnets | length == 0

- name: vnet - create/update/delete SDN vnets
  community.proxmox.proxmox_vnet:
    vnet:           "{{ item.vnet }}"
    zone:           "{{ item.zone }}"
    state:          "{{ item.state | default('present') }}"
    update:         "{{ item.update | default(omit) }}"
    alias:          "{{ item.alias | default(omit) }}"
    tag:            "{{ item.tag | default(omit) }}"
    vlanaware:      "{{ item.vlanaware | default(omit) }}"
    isolate_ports:  "{{ item.isolate_ports | default(omit) }}"
    delete:         "{{ item.delete | default(omit) }}"
  loop: "{{ proxmox_sdn_vnets }}"
  loop_control:
    label: "{{ item.vnet }}"
  delegate_to: localhost
