---
- name: proxmox_cluster - run with shared API connection defaults
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password | default(omit) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: proxmox_cluster - query cluster status and join info
      ansible.builtin.import_tasks: info.yml
      when: proxmox_cluster_do_info | bool
      tags: [proxmox_cluster, info]

    - name: proxmox_cluster - create a new cluster
      ansible.builtin.import_tasks: create.yml
      when: proxmox_cluster_do_create | bool
      tags: [proxmox_cluster, create]

    - name: proxmox_cluster - join nodes to an existing cluster
      ansible.builtin.import_tasks: join.yml
      when: proxmox_cluster_do_join | bool
      tags: [proxmox_cluster, join]
