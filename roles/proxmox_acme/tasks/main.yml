---
- name: proxmox_acme - run with shared API connection defaults
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password | default(omit) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: proxmox_acme - list ACME accounts and DNS plugins
      ansible.builtin.import_tasks: info.yml
      when: proxmox_acme_do_info | bool
      tags: [proxmox_acme, info]

    - name: proxmox_acme - manage ACME accounts
      ansible.builtin.import_tasks: account.yml
      when: proxmox_acme_do_account | bool
      tags: [proxmox_acme, account]

    - name: proxmox_acme - manage DNS challenge plugins
      ansible.builtin.import_tasks: plugin.yml
      when: proxmox_acme_do_plugin | bool
      tags: [proxmox_acme, plugin]

    - name: proxmox_acme - set node domains and order/renew/remove certificates
      ansible.builtin.import_tasks: certificate.yml
      when: proxmox_acme_do_certificate | bool
      tags: [proxmox_acme, certificate]
