---
- name: proxmox_vm - run with shared API connection defaults
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password | default(omit) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: proxmox_vm - gather cluster/node/storage info
      ansible.builtin.import_tasks: info.yml
      when: proxmox_vm_do_info | bool
      tags: [proxmox_vm, info]

    - name: proxmox_vm - clone VM from template
      ansible.builtin.import_tasks: clone.yml
      when: proxmox_vm_do_clone | bool
      tags: [proxmox_vm, clone]

    - name: proxmox_vm - start/stop/destroy VM
      ansible.builtin.import_tasks: lifecycle.yml
      when: proxmox_vm_do_lifecycle | bool
      tags: [proxmox_vm, lifecycle]

    - name: proxmox_vm - convert VM to template
      ansible.builtin.import_tasks: to_template.yml
      when: proxmox_vm_do_template | bool
      tags: [proxmox_vm, template]
