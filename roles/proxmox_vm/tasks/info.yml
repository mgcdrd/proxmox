---
# Read-only cluster/node/storage lookup. Useful as a pre-flight check before
# clone.yml (confirm target node/storage exist and have capacity) or for
# feeding a dynamic inventory / capacity report.

- name: info - query cluster status
  community.proxmox.proxmox_cluster_status_info:
  register: proxmox_vm_cluster_status
  delegate_to: localhost

- name: info - query node info
  community.proxmox.proxmox_node_info:
  register: proxmox_vm_node_facts
  delegate_to: localhost

- name: info - query storage info
  community.proxmox.proxmox_storage_info:
  register: proxmox_vm_storage_facts
  delegate_to: localhost

- name: info - report cluster summary
  ansible.builtin.debug:
    msg: >-
      Nodes: {{ proxmox_vm_node_facts.proxmox_nodes | map(attribute='node') | list }} —
      quorate: {{ proxmox_vm_cluster_status.cluster_status
        | selectattr('type', 'equalto', 'cluster') | map(attribute='quorate') | first | default('n/a') }} —
      storage: {{ proxmox_vm_storage_facts.proxmox_storages | map(attribute='storage') | list }}
