---
- name: ipset - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_firewall_ipsets must be a non-empty list, and each item needs a 'name' key."
  when: proxmox_firewall_ipsets | length == 0

- name: ipset - manage IP sets
  community.proxmox.proxmox_firewall:
    state: "{{ item.state | default('present') }}"
    ip_sets:
      - name:    "{{ item.name }}"
        comment: "{{ item.comment | default(omit) }}"
        cidrs:   "{{ item.cidrs | default(omit) }}"
  loop: "{{ proxmox_firewall_ipsets }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
