---
- name: proxmox_ceph - run with shared API connection defaults
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password | default(omit) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: proxmox_ceph - manage Ceph monitors
      ansible.builtin.import_tasks: mon.yml
      when: proxmox_ceph_do_mon | bool
      tags: [proxmox_ceph, mon]

    - name: proxmox_ceph - manage Ceph managers
      ansible.builtin.import_tasks: mgr.yml
      when: proxmox_ceph_do_mgr | bool
      tags: [proxmox_ceph, mgr]

    - name: proxmox_ceph - manage Ceph metadata servers
      ansible.builtin.import_tasks: mds.yml
      when: proxmox_ceph_do_mds | bool
      tags: [proxmox_ceph, mds]

    - name: proxmox_ceph - manage Ceph OSDs
      ansible.builtin.import_tasks: osd.yml
      when: proxmox_ceph_do_osd | bool
      tags: [proxmox_ceph, osd]

    - name: proxmox_ceph - manage Ceph pools
      ansible.builtin.import_tasks: pool.yml
      when: proxmox_ceph_do_pool | bool
      tags: [proxmox_ceph, pool]
