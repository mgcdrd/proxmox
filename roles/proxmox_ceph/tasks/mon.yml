---
- name: mon - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_ceph_mons must be a non-empty list, and each item needs a 'node' key."
  when: proxmox_ceph_mons | length == 0

# Monitor name is implicitly the node name — there is no separate mon-id
# param, and no config knobs (mon IP, etc.) beyond present/absent.
- name: mon - create/delete Ceph monitors
  community.proxmox.proxmox_ceph_mon:
    node:  "{{ item.node }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ proxmox_ceph_mons }}"
  loop_control:
    label: "{{ item.node }}"
  delegate_to: localhost
