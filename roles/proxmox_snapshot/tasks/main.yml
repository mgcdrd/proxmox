---
- name: proxmox_snapshot - run with shared API connection defaults
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password | default(omit) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
      api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: proxmox_snapshot - query snapshots
      ansible.builtin.import_tasks: info.yml
      when: proxmox_snapshot_do_info | bool
      tags: [proxmox_snapshot, info]

    - name: proxmox_snapshot - create/delete/rollback snapshots
      ansible.builtin.import_tasks: manage.yml
      when: proxmox_snapshot_do_manage | bool
      tags: [proxmox_snapshot, manage]
